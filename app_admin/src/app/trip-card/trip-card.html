<div style="border: 1px solid #ccc; padding: 16px; margin: 12px 0; border-radius: 8px;">
  <h2>{{ trip.name }}</h2>
  <img
  [src]="'assets/images/' + trip.image"
  [alt]="trip.name"
  style="width: 100%; height: 220px; object-fit: cover;"
>
  <p>{{ trip.resort }}</p>
  <p>{{ trip.length }} — {{ trip.perPerson }} per person</p>
  <p>{{ trip.description }}</p>

  <button (click)="editTrip(trip)" class="btn btn-info">Edit Trip</button>
</div>
