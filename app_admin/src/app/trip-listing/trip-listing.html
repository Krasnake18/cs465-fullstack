<div class="container mt-4">

    <!-- Add Trip Button - Only visible when logged in -->
    <div class="mb-4">
        <button
            class="btn btn-info"
            (click)="addTrip()"
            *ngIf="isLoggedIn()">
            Add Trip
        </button>
    </div>

    <!-- Display number of available trips -->
    <p>There are {{ trips.length }} trips available.</p>

    <!-- Display Trip Cards -->
    <div class="row">

        <div
            class="col-md-4 mb-4"
            *ngFor="let trip of trips">

            <app-trip-card
                [trip]="trip">
            </app-trip-card>

        </div>

    </div>

</div>
